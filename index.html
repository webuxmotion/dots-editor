<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dots-editor</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Minimalistic Layers Sidebar -->
    <div id="layers-panel" class="layers-minimal">
      <div class="layers-mini-header">
        <button id="add-layer-btn" title="Add New Layer">+</button>
      </div>
      <ul id="layers-list"></ul>
    </div>
    <div class="buttons">
      <span class="color-picker">
        <input type="color" id="color" name="body" value="#121314" />
        <label for="color">Background</label>
      </span>
      <span id="mode-container">
        <button id="DOTTED">Dotted</button>
        <button id="LINED">Lined</button>
      </span>
      <div class="brush-size-container">
        <label for="brush-size-input">Size:</label>
        <input type="range" id="brush-size-input" min="1" max="50" value="2" />
        <span id="brush-size-val">2px</span>
      </div>
      <div class="action-buttons-container">
        <button id="toggle-crop" class="toolbar-btn">
          <svg
            class="btn-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 2v14a2 2 0 0 0 2 2h14" />
            <path d="M18 22V8a2 2 0 0 0-2-2H2" />
          </svg>
          <span>Show Crop Area</span>
        </button>
        <button id="crop-and-save" class="toolbar-btn">Export .png</button>
      </div>
    </div>
    <canvas id="canvas"></canvas>
    <script type="module" src="./app.js"></script>
  </body>
</html>
